{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-icon">🏛</div>
    <h1>Authority Login</h1>
    <p class="login-sub">Access restricted to municipal officials only.</p>

    <form method="POST" action="{{ url_for('admin_login', next=request.args.get('next','')) }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Enter username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" autocomplete="current-password" required/>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Login →</button>
    </form>

    <div class="demo-creds">
      <p class="demo-title">🔑 Demo Credentials</p>
      <div class="cred-row">
        <span class="cred-label">Username</span>
        <code>admin</code>
        <span class="cred-sep">|</span>
        <span class="cred-label">Password</span>
        <code>civic2024</code>
      </div>
      <div class="cred-row" style="margin-top:.35rem">
        <span class="cred-label">Username</span>
        <code>authority</code>
        <span class="cred-sep">|</span>
        <span class="cred-label">Password</span>
        <code>hackathon</code>
      </div>
    </div>

    <a href="{{ url_for('home') }}" class="back-link" style="display:block;text-align:center;margin-top:1rem">
      ← Back to Home
    </a>
  </div>
</div>
{% endblock %}
