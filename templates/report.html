{% extends "base.html" %}
{% block title %}Report Issue{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Report a Civic Issue</h1>
  <p>Fill the form below. You'll receive a tracking ID to follow progress.</p>
</div>

<form class="form-card" method="POST" enctype="multipart/form-data" action="{{ url_for('report') }}">

  <div class="form-row">
    <div class="form-group">
      <label for="name">Your Name <span class="req">*</span></label>
      <input type="text" id="name" name="name" placeholder="e.g. Ravi Kumar" required/>
    </div>
    <div class="form-group">
      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone" placeholder="10-digit mobile"/>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="category">Issue Category <span class="req">*</span></label>
      <select id="category" name="category" required>
        <option value="">— Select Category —</option>
        <option>Road Damage</option>
        <option>Flooding / Drain</option>
        <option>Power Outage</option>
        <option>Water Leakage</option>
        <option>Garbage Overflow</option>
        <option>Broken Streetlight</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label for="severity">Severity <span class="req">*</span></label>
      <select id="severity" name="severity" required>
        <option value="">— Select Severity —</option>
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label for="location">Location / Address <span class="req">*</span></label>
    <input type="text" id="location" name="location" placeholder="e.g. MG Road, near bus stop, Ward 12" required/>
    <small>Be as specific as possible — street name, landmark, ward number.</small>
  </div>

  <div class="form-group">
    <label for="description">Description <span class="req">*</span></label>
    <textarea id="description" name="description" rows="4"
              placeholder="Describe the issue — what you see, since when, any danger involved…" required></textarea>
  </div>

  <div class="form-group">
    <label for="photo">Photo (optional, max 5 MB)</label>
    <input type="file" id="photo" name="photo" accept="image/*"/>
  </div>

  <button type="submit" class="btn btn-primary btn-full">Submit Report →</button>
</form>
{% endblock %}
